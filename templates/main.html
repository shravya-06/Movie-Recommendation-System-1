<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommended Movies</title>
    <style>
        body {
            background: linear-gradient(45deg, #ff6a00, #ee0979, #ff6a00, #ff9a9e);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            text-align: center;
            color: white;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        #recommendations {
            margin-top: 20px;
            font-size: 18px;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <h1>Recommended Movies</h1>
    <div id="recommendations"></div>
    
    <script>
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        function fetchRecommendations(movie) {
            // Dummy recommendations - replace this with actual logic
            const recommendations = {
                "Inception": ["Interstellar", "Shutter Island", "The Prestige"],
                "Avatar": ["Titanic", "Avengers", "Guardians of the Galaxy"],
                "The Dark Knight": ["Batman Begins", "Joker", "Man of Steel"]
            };

            return recommendations[movie] || ["No recommendations found"];
        }

        const movie = getQueryParam("movie");
        if (movie) {
            const recommendations = fetchRecommendations(movie);
            document.getElementById("recommendations").innerHTML = `
                <p>Recommendations for <strong>${movie}</strong>:</p>
                <ul>${recommendations.map(m => `<li>${m}</li>`).join("")}</ul>
            `;
        } else {
            document.getElementById("recommendations").innerHTML = "<p>No movie selected.</p>";
        }
    </script>
</body>
</html>
